@if (type() === 'image') {
  <img class="image" [src]="imageUrl()" alt="" />
} @else {
  <span class="text">{{ text() }}</span>
}
<button
  type="button"
  class="delete"
  (click)="deleteAnnotation.emit(); $event.stopPropagation()"
  aria-label="Удалить аннотацию"
  i18n-aria-label="@@deleteAnnotationLabel"
>
  x
</button>
